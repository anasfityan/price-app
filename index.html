<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050506">
<title>Trendy Store</title>
<style>
html,body{margin:0;min-height:100%;background:#050506}
#boot{min-height:100vh;display:grid;place-items:center;font-family:system-ui,sans-serif;color:#f0c86d;font-weight:800}
</style>
</head>
<body>
<div id="boot">جاري تحميل Trendy Store…</div>
<script>
(async function(){
  const VERSION='25';
  try{
    const response=await fetch('./app-core.html?v='+VERSION,{cache:'no-store'});
    if(!response.ok) throw new Error('app-core '+response.status);
    let html=await response.text();

    html=html
      .replace(/const\s+_c\s*=\s*atob\([^;]+\);?/g,"const _c = ''; // disabled")
      .replace(/,\s*user-scalable\s*=\s*no/gi,'')
      .replace(/user-scalable\s*=\s*no\s*,?/gi,'');

    html=html.replace('</head>',
      '<link rel="stylesheet" href="./ui-refinement.css?v='+VERSION+'">'+
      '<link rel="stylesheet" href="./performance-tuning.css?v='+VERSION+'">'+
      '<link rel="stylesheet" href="./ui-polish.css?v='+VERSION+'">'+
      '</head>');

    html=html.replace('</body>',
      '<script src="./ui-refinement.js?v='+VERSION+'"><\/script>'+
      '<script src="./security-lockdown.js?v='+VERSION+'"><\/script>'+
      '<script src="./runtime-cleanup.js?v='+VERSION+'"><\/script>'+
      '<script src="./performance-tuning.js?v='+VERSION+'"><\/script>'+
      '<script src="./final-audit.js?v='+VERSION+'"><\/script>'+
      '<script src="./ui-polish.js?v='+VERSION+'"><\/script>'+
      '</body>');

    document.open();
    document.write(html);
    document.close();
  }catch(error){
    console.error(error);
    document.getElementById('boot').textContent='تعذر تحميل التطبيق. حدّث الصفحة.';
  }
})();
</script>
</body>
</html>
