<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#0b0c0f">
<title>Trendy Store</title>
<link rel="manifest" href="./manifest.json?v=19">
<style>html,body{margin:0;min-height:100%;background:#0b0c0f}#boot{display:grid;place-items:center;min-height:100vh;font-family:system-ui,sans-serif;color:#c9a85f}</style>
</head>
<body>
<div id="boot">جاري تحميل Trendy Store…</div>
<script>
(async function(){
  const VERSION='19';
  const CORE='https://raw.githubusercontent.com/anasfityan/price-app/907ceb5d0b7d64fd55383bb7325241250ba38154/index.html?v='+VERSION;
  try{
    const cleanupKey='trendy_direct_loader_v'+VERSION;
    if(localStorage.getItem(cleanupKey)!=='1'){
      if('caches' in window){
        const keys=await caches.keys();
        await Promise.all(keys.filter(k=>k.startsWith('trendy-')).map(k=>caches.delete(k)));
      }
      if('serviceWorker' in navigator){
        const regs=await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map(r=>r.unregister()));
      }
      localStorage.setItem(cleanupKey,'1');
    }

    const res=await fetch(CORE,{cache:'no-store'});
    if(!res.ok) throw new Error('core '+res.status);
    let html=await res.text();

    html=html
      .replace(/const\s+_c\s*=\s*atob\([^;]+\);?/g,"const _c = ''; // disabled")
      .replace(/,\s*user-scalable\s*=\s*no/gi,'')
      .replace(/user-scalable\s*=\s*no\s*,?/gi,'');

    html=html.replace('</head>',
      '<link rel="stylesheet" href="./ui-refinement.css?v='+VERSION+'">'+
      '<link rel="stylesheet" href="./performance-tuning.css?v='+VERSION+'">'+
      '</head>');

    html=html.replace('</body>',
      '<script src="./ui-refinement.js?v='+VERSION+'"><\/script>'+
      '<script src="./security-lockdown.js?v='+VERSION+'"><\/script>'+
      '<script src="./runtime-cleanup.js?v='+VERSION+'"><\/script>'+
      '<script src="./performance-tuning.js?v='+VERSION+'"><\/script>'+
      '<script src="./final-audit.js?v='+VERSION+'"><\/script>'+
      '<script>if(\'serviceWorker\' in navigator){navigator.serviceWorker.register(\'./sw.js?v='+VERSION+'\',{updateViaCache:\'none\'}).catch(function(){});}<\/script>'+
      '</body>');

    document.open();
    document.write(html);
    document.close();
  }catch(err){
    console.error(err);
    const boot=document.getElementById('boot');
    if(boot) boot.textContent='تعذر تحميل التطبيق. حدّث الصفحة مرة أخرى.';
  }
})();
</script>
</body>
</html>
